<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgilCRis Consultoria | Bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Cores Corporativas AgilCRis */
            --bg-color: #f4f4f2; 
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-main: #121212;
            --text-sub: #4a4a4a;
            --glow-vicios: rgba(255, 255, 255, 1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f4f4f2 0%, #e8e8e3 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* Botão Voltar Ajustado */
        .btn-voltar {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: white;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 80px 0 40px;
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 900;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* Estilo dos Cards com Vidro e Peso 800 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            text-decoration: none; /* Garante que o link funcione */
            color: var(--text-main);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.08);
        }

        /* Gradientes nos Ícones (Opção 1) */
        .icon-box {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-right: 16px;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .content { text-align: left; }

        .content h3 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800; /* Peso solicitado */
            color: #000;
        }

        .content p {
            margin: 3px 0 0;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* DIFERENCIAL: CONTROLE DE VÍCIOS (BRILHO) */
        .card-vicios {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #ffffff;
            box-shadow: 0 0 20px var(--glow-vicios);
        }

        .card-vicios .icon-box {
            background: linear-gradient(135deg, #fffdf0 0%, #fff4cc 100%);
        }

        .card-vicios h3 {
            color: #856404; /* Destaque elegante sem ser azul */
        }

        .arrow { margin-left: auto; color: #bbb; font-size: 1rem; }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="btn-voltar">← Voltar</a>

    <div class="container">
        <h1>AgilCRis Consultoria</h1>
        <p class="subtitle">Soluções Financeiras e Gestão 360°</p>

        <a href="LINK_AQUI" class="card">
            <div class="icon-box">💰</div>
            <div class="content">
                <h3>Método AgilCRis</h3>
                <p>Estratégia de Consórcios e Patrimônio</p>
            </div>
            <div class="arrow">→</div>
        </a>

        <a href="LINK_AQUI" class="card">
            <div class="icon-box">📊</div>
            <div class="content">
                <h3>Planilha GOLD 2026</h3>
                <p>Gestão de Lucro para E-commerce</p>
            </div>
            <div class="arrow">→</div>
        </a>

        <a href="LINK_AQUI" class="card card-vicios">
            <div class="icon-box">🛡️</div>
            <div class="content">
                <h3>Controle de Vícios</h3>
                <p>Apoio e Gestão de Hábitos</p>
            </div>
            <div class="arrow">→</div>
        </a>

    </div>

</body>
</html>
