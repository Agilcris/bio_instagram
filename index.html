<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgilCRis Consultoria | Consórcios e Gestão Financeira | Cris Grazy</title>
<meta name="description" content="Consultoria financeira especializada em consórcios sem juros, baixa de empresas e controle de lucro para e-commerce com a expertise de Cristiane Graziela.">
<meta name="author" content="Cristiane Graziela">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9963A;
    --gold-light: #E8C07A;
    --gold-pale: #F5E6C8;
    --cream: #FDF8F0;
    --dark: #1A1208;
    --muted: #7A6A4F;
    --text: #3D2E12;
  }
  body { background: var(--cream); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; margin: 0; }
  
  /* BOTÃO VOLTAR REFORÇADO */
  .btn-voltar {
    position: fixed; top: 20px; left: 20px;
    text-decoration: none; color: var(--muted);
    background: white; padding: 10px 18px;
    border-radius: 50px; font-size: 12px; font-weight: 700;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    display: flex; align-items: center; gap: 8px;
    z-index: 9999; border: 1px solid rgba(201,150,58,0.2);
    transition: 0.3s; text-transform: uppercase;
    cursor: pointer;
  }
  .btn-voltar:hover { background: var(--gold-pale); color: var(--gold); transform: scale(1.05); }

  .container { max-width: 480px; margin: 0 auto; padding: 80px 20px 60px; text-align: center; }
  
  /* AVATAR E HERO */
  .avatar-ring {
    width: 90px; height: 90px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    margin: 0 auto 20px; padding: 3px; display: flex; align-items: center; justify-content: center;
  }
  .avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: white; overflow: hidden; }
  .avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
  
  .hero-name { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--dark); margin-bottom: 5px; }
  .hero-headline { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900; line-height: 1.2; margin-bottom: 25px; }
  .hero-headline span { color: var(--gold); display: block; }

  /* LINKS */
  .cta-main {
    display: block; background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--dark); text-decoration: none; font-weight: 700;
    padding: 20px; border-radius: 15px; margin-bottom: 15px;
    box-shadow: 0 10px 25px rgba(201,150,58,0.3);
  }
  .btn-service {
    display: flex; align-items: center; gap: 15px;
    background: white; padding: 15px; border-radius: 12px;
    text-decoration: none; color: var(--text); margin-bottom: 12px;
    border: 1px solid rgba(201,150,58,0.1); text-align: left;
  }
  .btn-icon { font-size: 20px; width: 40px; text-align: center; }
  .btn-text strong { display: block; font-size: 14px; color: var(--dark); }
  .btn-text span { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<a href="https://agilcris.github.io/bio_instagram/" onclick="window.history.go(-1); return false;" class="btn-voltar">
  <span>←</span> VOLTAR
</a>

<div class="container">
  <div class="avatar-ring">
    <div class="avatar-inner">
      <img src="https://github.com/Agilcris.png" alt="Cris Grazy">
    </div>
  </div>

  <h1 class="hero-name">Cris Grazy</h1>
  <h2 class="hero-headline">Conquiste seu carro ou casa <span>sem pagar juros 💰</span></h2>

  <a href="https://agilcris.github.io/lucrando-com-consorcio/" class="cta-main">
    🔥 Simular meu consórcio agora
  </a>

  <a href="https://agilcris.github.io/controle_financeiro_e-comercio/" class="btn-service">
    <span class="btn-icon">📊</span>
    <div class="btn-text">
      <strong>Planilha E-commerce</strong>
      <span>Lucro Real Shopee e ML</span>
    </div>
  </a>

  <a href="https://agilcris.github.io/fechamento_empresas-XLSX/" class="btn-service">
    <span class="btn-icon">⚖️</span>
    <div class="btn-text">
      <strong>Baixa de Empresas</strong>
      <span>Regularização de CPF</span>
    </div>
  </a>

  <p style="margin-top: 40px; font-size: 11px; color: var(--muted);">AgilCRis Consultoria • @agilcris_gestao</p>
</div>

</body>
</html>
